# Render Blueprint: веб-сервис из Dockerfile и управляемая PostgreSQL.
# Render Dashboard, New, Blueprint, выбрать этот репозиторий.
services:
  - type: web
    name: cv-graphql
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cv-graphql-db
          property: connectionString

databases:
  - name: cv-graphql-db
    plan: free
    region: frankfurt
    databaseName: cv
    user: cv
    postgresMajorVersion: '17'
